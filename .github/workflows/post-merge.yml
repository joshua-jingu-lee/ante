name: Post Merge

on:
  # PAT(AUTOMERGE_TOKEN)로 enable한 auto-merge의 머지 actor는 PAT 소유자라
  # pull_request:closed 이벤트가 정상 발화한다(#2437). GITHUB_TOKEN 머지는
  # 재귀 방지 규칙으로 이 이벤트를 만들지 않으므로 pr-approvals.yml이 fail-closed다.
  pull_request:
    types:
      - closed
  # 수동 복구 진입점: 머지된 PR은 재오픈 불가라 closed 이벤트를 재발화할 수 없다.
  # 정리가 누락되면 issue_numbers로 직접 reconcile한다 (00 §6 close 규칙·04 §5.2 복구 계약).
  workflow_dispatch:
    inputs:
      issue_numbers:
        description: Comma-separated issue numbers to reconcile directly (manual recovery)
        required: false
        type: string

jobs:
  post-merge:
    name: post-merge
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Update linked issues
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventName = context.eventName;
            const closingPattern =
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;

            function parseIssueNumbers(text) {
              return [...(text || "").matchAll(closingPattern)].map((match) => Number(match[1]));
            }

            let pr = null;
            let issueNumbers = [];

            if (eventName === "workflow_dispatch") {
              const workflowInputs = context.payload.inputs || {};
              const issueNumbersInput = String(workflowInputs.issue_numbers || "").trim();

              if (issueNumbersInput) {
                issueNumbers.push(
                  ...issueNumbersInput
                    .split(",")
                    .map((value) => Number(value.trim()))
                    .filter((value) => Number.isInteger(value) && value > 0),
                );
              }

              if (issueNumbers.length === 0) {
                core.setFailed("workflow_dispatch requires issue_numbers.");
                return;
              }
            } else {
              pr = context.payload.pull_request;
              issueNumbers.push(...parseIssueNumbers(pr.body || ""));
            }

            const uniqueRefs = [...new Set(issueNumbers)];

            core.info(
              `Linked issues from ${eventName === "workflow_dispatch" ? "manual dispatch" : "merged PR"}: ` +
              `${uniqueRefs.join(", ") || "(none)"}`
            );

            if (uniqueRefs.length === 0) {
              core.warning("No linked issues found; nothing to reconcile.");
              return;
            }

            async function hasPostMergeComment(issueNumber, prNumber) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              const prNeedle = prNumber ? `- PR: #${prNumber}` : "- PR: n-a";

              return comments.some((comment) => {
                const body = comment.body || "";
                return body.includes("🤖 **Post-merge 정리 완료**") && body.includes(prNeedle);
              });
            }

            async function addPostMergeComment(issueNumber, summary) {
              if (await hasPostMergeComment(issueNumber, summary.prNumber)) {
                core.info(`Post-merge comment already exists for issue #${issueNumber}.`);
                return;
              }

              const prLine = summary.prNumber ? `- PR: #${summary.prNumber}` : "- PR: n-a";
              const epicLine = summary.epicNumber
                ? `- epic: #${summary.epicNumber} (${summary.epicStatus})`
                : "- epic: n-a";

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body:
                  `🤖 **Post-merge 정리 완료**\n` +
                  `${prLine}\n` +
                  `- issue checklist: ${summary.checkboxUpdated ? "updated" : "unchanged"}\n` +
                  `- issue state: ${summary.issueClosed ? "closed" : "already-closed"}\n` +
                  `${epicLine}\n` +
                  "- source: post-merge.yml",
              });
            }

            // 체크박스 갱신은 `완료 조건` 절에만 적용한다(#2509). 본문 전체를
            // 치환하면 이슈 폼의 `위험 신호`처럼 완료 조건이 아닌 체크박스까지
            // 「해당함」으로 바뀌어 감사 기록이 거짓이 된다. 절은 `완료 조건`
            // 헤딩 다음 줄부터 다음 헤딩 직전까지이며, 그 헤딩이 없으면
            // 아무것도 갱신하지 않는다. 웹 편집이 만드는 CRLF 본문에서도
            // 동작하도록 헤딩 판정 전에 행 끝 CR을 떼고 본다. 코드 펜스 안은
            // 헤딩으로도 체크박스로도 보지 않는다 — 런북 템플릿을 인용한 본문의
            // 예시 체크박스가 체크되면 그 자체가 거짓 기록이다. 펜스는 여는 것과
            // 같은 문자로 같은 길이 이상이고 뒤에 다른 글자가 없을 때만 닫힌다
            // (CommonMark). 펜스 안 줄은 헤딩 판정도 체크박스 치환도 건너뛴다 —
            // 헤딩만 막으면 완료 조건 절 안에 인용한 예시 체크박스가 체크된다.
            // 헤딩도 펜스와 같이 선행 공백 3칸까지 받는다 — 같은 함수 안에서
            // 관용도가 갈리면 그 비대칭이 다음 변형의 씨앗이 된다.
            function checkDoneCriteria(body) {
              const lines = body.split("\n");
              let inDoneCriteria = false;
              let fenceMarker = null;

              for (let index = 0; index < lines.length; index += 1) {
                const line = lines[index].replace(/\r$/, "");

                const fence = line.match(/^ {0,3}(`{3,}|~{3,})(.*)$/);

                if (fence) {
                  if (!fenceMarker) {
                    fenceMarker = fence[1];
                  } else if (
                    fence[1][0] === fenceMarker[0] &&
                    fence[1].length >= fenceMarker.length &&
                    fence[2].trim() === ""
                  ) {
                    fenceMarker = null;
                  }
                  continue;
                }

                if (fenceMarker) {
                  continue;
                }

                const heading = line.match(/^ {0,3}#{1,6}\s+(.*)$/);

                if (heading) {
                  inDoneCriteria = /^완료 조건(?:\s|$)/.test(heading[1].trim());
                  continue;
                }

                if (inDoneCriteria) {
                  lines[index] = lines[index].replace(/^- \[ \]/, "- [x]");
                }
              }

              return lines.join("\n");
            }

            async function markIssueDone(issueNumber) {
              const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              const originalBody = issue.data.body || "";
              const updatedBody = checkDoneCriteria(originalBody);
              const checkboxUpdated = updatedBody !== originalBody;
              let issueClosed = false;

              if (checkboxUpdated) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: updatedBody,
                });
              }

              if (issue.data.state !== "closed") {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  state: "closed",
                });
                issueClosed = true;
              }

              const epicMatch = originalBody.match(/(?:에픽|Epic)\s*:\s*#(\d+)/i);
              if (!epicMatch) {
                await addPostMergeComment(issueNumber, {
                  prNumber: pr?.number,
                  checkboxUpdated,
                  issueClosed,
                });
                return;
              }

              const epicNumber = Number(epicMatch[1]);
              const epic = await github.rest.issues.get({ owner, repo, issue_number: epicNumber });
              const epicBody = epic.data.body || "";
              const updatedEpicBody = epicBody.replace(
                new RegExp(`- \\[ \\](.*#${issueNumber}\\b)`, "g"),
                "- [x]$1",
              );
              let epicChecklistUpdated = false;
              let epicClosed = false;

              if (updatedEpicBody !== epicBody) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: epicNumber,
                  body: updatedEpicBody,
                });
                epicChecklistUpdated = true;
              }

              if (!updatedEpicBody.match(/^- \[ \]/m) && epic.data.state !== "closed") {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: epicNumber,
                  state: "closed",
                });
                epicClosed = true;
              }

              await addPostMergeComment(issueNumber, {
                prNumber: pr?.number,
                checkboxUpdated,
                issueClosed,
                epicNumber,
                epicStatus:
                  `${epicChecklistUpdated ? "checklist-updated" : "checklist-unchanged"}, ` +
                  `${epicClosed ? "closed" : "open-or-already-closed"}`,
              });
            }

            for (const issueNumber of uniqueRefs) {
              await markIssueDone(issueNumber);
            }
