name: PR Approvals

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened
    branches:
      - main
      - 'epic/**'

concurrency:
  group: pr-approvals-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-gate:
    name: merge-gate
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # auto-merge를 PAT(AUTOMERGE_TOKEN)로 enable한다 (#2437). 머지 actor가 PAT 소유자가
      # 되어 머지가 pull_request:closed 이벤트를 정상 발화 → post-merge.yml이 폴링 없이 동작한다.
      # fail-closed: 시크릿 부재 시 명시 실패한다. GITHUB_TOKEN 폴백은 금지 — 그 머지는
      # closed 이벤트를 만들지 않아(재귀 방지 규칙) 폴링도 없는 지금은 정리가 조용히 소실된다
      # (이슈는 네이티브 auto-close로 닫혀 정상처럼 보이는 위장된 누락).
      - name: Enable auto-merge (PAT — fail-closed)
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AUTOMERGE_TOKEN 시크릿이 없어 auto-merge를 걸 수 없습니다 (fail-closed, #2437)." >&2
            echo "GITHUB_TOKEN 폴백은 금지됩니다: 그 머지는 pull_request:closed 이벤트를 발화하지 않아 post-merge 정리가 조용히 소실됩니다." >&2
            echo "복구: 저장소에 fine-grained PAT(Contents RW + Pull requests RW)를 AUTOMERGE_TOKEN 시크릿으로 등록한 뒤 이 PR을 재트리거(close→reopen)하세요." >&2
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
