name: Semantic Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (릴리스 없이 버전만 확인)"
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # step-level if는 Actions expression 평가라 셸 보간이 없어 ref 이름 인젝션을 원천 차단하고,
      # checkout/pip 이전에 fail-fast한다. 비-main ref는 PSR 소문자 no-release 메시지로
      # case-sensitive grep 판정이 빗나가 released 오보고를 낼 수 있어 차단한다 (#2416).
      - name: Guard main-only (#2416)
        if: github.ref_name != 'main'
        run: |
          echo "이 워크플로우는 main ref 전용이다 (#2416)." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install python-semantic-release
        run: pip install python-semantic-release

      # 1. 버전 계산 + 빌드용 버전 반영
      - name: Run semantic-release
        id: semrel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # dry_run=true: 커밋·태그·push 없이 버전 계산만 수행한다 (#2416).
          # dry_run=false(실 릴리스) 경로 명령은 기존과 바이트 동일하게 유지하므로 재들여쓰기하지 않는다.
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            OUTPUT=$(semantic-release version --no-commit --no-tag --no-push --no-vcs-release 2>&1) || true
          else
          OUTPUT=$(semantic-release version --no-vcs-release 2>&1) || true
          fi
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "No release will be made"; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(semantic-release version --print-tag 2>/dev/null || echo "")
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      # 이하 단계는 새 릴리스가 있고 dry_run이 아닐 때만 실행
      # 2. Python 패키지 빌드
      - name: Build Python package
        if: steps.semrel.outputs.released == 'true' && inputs.dry_run == false
        run: pip install build && python -m build

      # 3. GitHub Release 생성
      - name: Create GitHub Release
        if: steps.semrel.outputs.released == 'true' && inputs.dry_run == false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semrel.outputs.tag }}
          files: dist/*
          generate_release_notes: true
