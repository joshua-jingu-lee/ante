name: Publish Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch: {}

# concurrency 미적용(#2428): concurrency 그룹은 pending run을 최대 1개만 유지하고
# 새 run이 큐잉되면 기존 pending run을 무음 취소(failure 아님)한다. run이 겹치면
# (실행 1 + pending 1 상태에서 세 번째 트리거) pending 중이던 릴리스의 run이 새 run으로
# 대체·무음 취소되어 해당 릴리스의 PyPI/GHCR 배포가 누락되고, 막으려던 :latest 경합(희귀)보다
# 나쁜 실패 모드가 된다. 릴리스는 수동·순차(사용자 확인 포함)라 겹침이 실질적으로 없어
# 직렬화 이득도 없다. (semantic-release.yml concurrency는 유지 — 상세·주의는 런북 04 §7)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # release 이벤트의 checkout ref는 태그 커밋이고 checkout@v5 기본 depth=1이라
      # 도달/동일-커밋 태그만 보인다. :latest semver 가드(아래)가 전역 최고 태그를 정확히
      # 판정하려면 전역 태그를 명시적으로 가져와야 한다 (#2430). fetch-tags:true는 depth=1에서
      # 전역 태그 리프스펙을 추가하지 않아(도달/동일-커밋 태그만 확보) 과거 라인 핫픽스 태그가
      # IS_HIGHEST를 오판 → :latest 역행을 재생산하므로 명시 fetch를 쓴다.
      - name: Fetch all tags for :latest semver guard
        shell: bash
        run: git fetch --tags --force origin

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Verify wheel contents
        run: |
          pip install dist/*.whl
          python -c "import ante; print('OK')"

      # Trusted Publishing(OIDC) (#2436): 명시적 자격증명 입력(username/토큰)을 주지 않으면
      # pypa v1.14.0이 id-token:write + environment:pypi로 OIDC 인증을 자동 진입한다(README ref=v1.14.0).
      # PYPI_API_TOKEN 시크릿은 삭제하지 않고 폴백용으로 보존한다 — OIDC 실패 시 06 §11 절차.
      # 사전조건: PyPI 프로젝트(ante)에 trusted publisher가 직접 등록돼 있어야 한다(06 §8).
      - name: Publish to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

      - name: Derive Docker image metadata
        id: image
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="dry-run"
          fi
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # :latest semver 가드 (#2430): 릴리스 태그가 전역 최고 semver일 때만 :latest를 포함해,
      # 과거 라인 핫픽스(예: v0.11.0 운영 중 v0.10.2 릴리스) 시 :latest 역행을 차단한다.
      # 조건부 태그 목록을 heredoc 멀티라인 output(tags)으로 구성해 build-push의 tags 입력으로
      # 넘긴다(인라인 표현식 조건으로 빈 줄을 남기지 않는 docker/metadata-action 표준 패턴).
      - name: Resolve Docker tags (:latest semver guard)
        id: docker_tags
        shell: bash
        run: |
          IMAGE="${{ steps.image.outputs.image }}"
          TAG="${{ steps.image.outputs.tag }}"
          VERSION="${{ steps.image.outputs.version }}"
          # 전역 semver 태그만 앵커드 정규식(^v[0-9]+\.[0-9]+\.[0-9]+$)으로 필터해 최고를 구한다.
          # 앵커링으로 프리릴리스·노이즈(vX.Y.Z-rc1, nightly 등)를 배제 → sort -V 프리릴리스 취약성도 무력화.
          # || true: GHA `shell: bash`는 `-eo pipefail`로 돌아, grep 무매치(clean semver 태그 0개
          # /노이즈만) 시 파이프라인이 exit 1 → errexit로 스텝이 즉사한다. 무매치를 흡수해야
          # HIGHEST가 빈 문자열이 되어 아래 [ -z "$HIGHEST" ] 첫 릴리스 분기가 도달 가능해진다.
          HIGHEST=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          # 릴리스 태그가 전역 최고와 문자열 등가일 때만 :latest 포함.
          # HIGHEST 공백(전역 semver 태그 0개)이면 이 릴리스가 유일 최고이므로 포함.
          # dry-run(TAG=dry-run)은 HIGHEST(비공백)와 불일치 → 자연히 제외(push도 안 함).
          if [ -z "$HIGHEST" ] || [ "$TAG" = "$HIGHEST" ]; then
            INCLUDE_LATEST=true
          else
            INCLUDE_LATEST=false
          fi
          echo "Release tag: ${TAG}"
          echo "Highest global semver tag: ${HIGHEST:-<none>}"
          echo "Include :latest -> ${INCLUDE_LATEST}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${TAG}"
            echo "${IMAGE}:${VERSION}"
            if [ "$INCLUDE_LATEST" = "true" ]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.docker_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
