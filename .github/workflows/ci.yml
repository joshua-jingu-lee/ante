name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
      - 'epic/**'
  # 머지 결과물(main HEAD)에서 lint/test를 재실행해 base가 뒤처진 PR들의
  # 순차 auto-merge로 생긴 조합 회귀를 사후 검출한다 (#2428).
  push:
    branches:
      - main

# 기본 권한을 read-only로 최소화한다 (#2428). CI는 저장소 읽기만 필요하다.
permissions:
  contents: read

concurrency:
  # push(refs/heads/main)와 pull_request(refs/pull/N/merge)는 github.ref가 달라
  # 그룹 키가 분리되므로 PR CI와 main push CI가 서로 취소하지 않는다 (#2428).
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: MyPy type check
        run: mypy src/

      - name: Lint ratchet check
        run: python scripts/check_lint_ratchet.py

      - name: Generated artifact sync check
        run: |
          python scripts/generate_project_structure.py --check
          python scripts/generate_cli_reference.py --check
          python scripts/generate_db_schema.py --check
          python scripts/generate_ipc_commands.py --check
          python scripts/generate_error_codes.py --check

      - name: Prose budget check
        run: python scripts/check_prose_budget.py

      - name: Comment check
        run: python scripts/check_comments.py

      - name: Spec code block check
        run: python scripts/check_spec_code_blocks.py

      - name: Import boundary check
        run: python scripts/check_imports.py

      - name: Entry ratchet check
        run: python scripts/check_entry_ratchet.py

      # 매치 없는 glob은 node --test가 0건으로 통과시키므로 셸에서 실패로 만든다.
      - name: Workflow script tests
        shell: bash
        run: |
          shopt -s failglob
          node --test .github/scripts/*.test.js

  # 단위 테스트를 파일별 소요 시간 기록(tests/shard_durations.json)으로 고르게 나눠
  # 동시에 돌린다. 기록이 없거나 깨졌으면 파일 경로의 crc32로 나눈다 (#2786, #3036).
  # 각 샤드는 그 기록을 다시 만들 재료 durations-shard-<i>.json을 산출물에 싣는다.
  # 샤드 수는 아래 matrix 목록 한 곳에서 정해지고, 샤드는 strategy.job-total로,
  # test 잡은 이 잡의 출력 shards로 읽는다.
  test-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5]
    outputs:
      shards: ${{ steps.count.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        env:
          ANTE_DB_ENCRYPTION_KEY: "sm4fkbGXHVNKjw2OvQIrQX5g9qdRGqNKST8pFixdNPk="
          COVERAGE_FILE: coverage-shard-${{ matrix.shard }}.data
        run: >-
          pytest tests/unit/ -x -n auto --tb=short -q
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --shard-manifest=test-shard-${{ matrix.shard }}.txt
          --shard-durations=durations-shard-${{ matrix.shard }}.json
          --cov=src/ante --cov-report= --cov-fail-under=0

      - id: count
        run: echo "shards=${{ strategy.job-total }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.shard }}
          path: |
            coverage-shard-${{ matrix.shard }}.data
            test-shard-${{ matrix.shard }}.txt
            durations-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test-shard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - uses: actions/download-artifact@v8
        with:
          pattern: shard-*
          merge-multiple: true
          path: shard-artifacts

      - name: Check shards partition the unit tests
        env:
          ANTE_DB_ENCRYPTION_KEY: "sm4fkbGXHVNKjw2OvQIrQX5g9qdRGqNKST8pFixdNPk="
          SHARDS: ${{ needs.test-shard.outputs.shards }}
        run: |
          pytest tests/unit/ --collect-only -q -p no:xdist > collect-unit.txt
          python scripts/check_test_shards.py --shards "$SHARDS" \
            --collected collect-unit.txt --manifest-dir shard-artifacts

      - name: Combine coverage
        run: |
          coverage combine shard-artifacts/coverage-shard-*.data
          coverage report --fail-under=80

      - name: Run integration tests
        env:
          ANTE_DB_ENCRYPTION_KEY: "sm4fkbGXHVNKjw2OvQIrQX5g9qdRGqNKST8pFixdNPk="
        run: pytest tests/integration/ -x --tb=short -q

      # 시나리오마다 실행 기록(JSON)을 남기고, 실패해도 잡의 요약에 표로 쓰고
      # 아티팩트 e2e-records로 올린다 (#2823). 기록에는 출력 원문·토큰·로컬
      # 절대 경로가 없다.
      - name: Run e2e scenarios
        timeout-minutes: 10
        env:
          ANTE_E2E_RECORD_DIR: ${{ runner.temp }}/e2e-records
        run: pytest tests/e2e/ -x --tb=short -q -rA

      - name: Summarize e2e records
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: >-
          python scripts/render_e2e_records.py "$RUNNER_TEMP/e2e-records"
          >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-records
          path: ${{ runner.temp }}/e2e-records/
          if-no-files-found: ignore
          retention-days: 3

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Skip Docker build for non-release PR
        if: ${{ !startsWith(github.head_ref, 'release/') }}
        run: echo "Docker build is only required for release PRs."

      - uses: actions/checkout@v7
        if: ${{ startsWith(github.head_ref, 'release/') }}

      - name: Build Docker image
        if: ${{ startsWith(github.head_ref, 'release/') }}
        run: docker build -t ante:release-pr .

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - docker-build
    if: always()
    steps:
      - name: CI gate
        run: |
          for r in "${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.docker-build.result }}"; do
            [ "$r" = "success" ] || { echo "Upstream job failed: $r"; exit 1; }
          done
