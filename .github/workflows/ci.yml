name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
      - 'epic/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: MyPy type check
        run: mypy src/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        env:
          ANTE_DB_ENCRYPTION_KEY: "sm4fkbGXHVNKjw2OvQIrQX5g9qdRGqNKST8pFixdNPk="
        run: pytest tests/unit/ -x -n auto --tb=short -q --cov=src/ante --cov-fail-under=80

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Skip Docker build for non-release PR
        if: ${{ !startsWith(github.head_ref, 'release/') }}
        run: echo "Docker build is only required for release PRs."

      - uses: actions/checkout@v4
        if: ${{ startsWith(github.head_ref, 'release/') }}

      - name: Build Docker image
        if: ${{ startsWith(github.head_ref, 'release/') }}
        run: docker build -t ante:release-pr .

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - docker-build
    if: always()
    steps:
      - name: CI gate
        run: |
          for r in "${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.docker-build.result }}"; do
            [ "$r" = "success" ] || { echo "Upstream job failed: $r"; exit 1; }
          done
