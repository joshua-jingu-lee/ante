name: "[docs] 문서 작성/수정"
description: 문서 작성 또는 수정 요청
title: "[docs] "
labels: ["docs"]
body:
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 지금 문서가 무엇을 잘못 말하고 있는지, 또는 어떤 서술이 비어 있는지.
    validations:
      required: true

  - type: textarea
    id: target-docs
    attributes:
      label: 대상 문서
      description: 고칠 문서의 저장소 루트 상대 경로와 절 번호를 적어주세요.
      value: |
        - `docs/...` §
    validations:
      required: true

  - type: textarea
    id: ssot-relation
    attributes:
      label: SSOT 관계
      description: 이 서술의 정본이 어느 문서인지, 대상 문서가 정본인지 사본인지 적어주세요. 사본이면 정본을 먼저 고쳐야 합니다.
    validations:
      required: true

  - type: textarea
    id: consumers
    attributes:
      label: 영향 소비자
      description: 이 서술을 참조하는 다른 문서·커맨드·에이전트 정의·CI 스크립트를 적어주세요. 수정 금지 표면이면 그렇게 표시해주세요.
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: 비목표
      description: 이번 이슈에서 같이 하지 않을 변경을 적어주세요. 구현 단계가 「이번 PR에서 하지 말아야 할 확장」으로 소비한다.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 검증 방법
      description: 고친 서술이 맞다는 것을 어떻게 확인할지 적어주세요 (재생성 명령, 대조할 사본 문서, 실행해 볼 절차 등).
    validations:
      required: true

  - type: textarea
    id: technical-notes
    attributes:
      label: 기술 노트
      description: "구현 시 참고할 제약 조건, 관련 모듈, 설계 문서 링크 등. 에픽 하위 이슈면 00-issue-management.md §3.4가 정한 대로 `- 선행: #번호`를 여기에 적는다. (선택)"

  - type: textarea
    id: done-criteria
    attributes:
      label: 완료 조건
      value: |
        - [ ] 대상 문서 수정
        - [ ] 사본 문서와의 정합 확인 (해당 시)
        - [ ] 검증 방법 실행 및 결과 첨부
        - [ ] 생성 산출물 재생성 (해당 시)
        - [ ] 기존 테스트 전체 통과
    validations:
      required: true
