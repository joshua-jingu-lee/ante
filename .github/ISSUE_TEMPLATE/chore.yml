name: "[chore] 빌드 / CI / 인프라"
description: 빌드, CI/CD, 배포, 의존성, 운영 스크립트 등 잡무
title: "[chore] "
labels: ["chore"]
body:
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 어떤 운영·빌드상의 불편이나 결함이 있는지.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 변경 범위
      description: 영향받는 모듈, 파일 목록을 적어주세요.
      value: |
        - `.github/workflows/...`
    validations:
      required: true

  - type: textarea
    id: consumers
    attributes:
      label: 영향 소비자
      description: 이 변경이 닿는 CI job, 배포 경로, 로컬 개발 흐름, 릴리스 절차를 적어주세요.
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: 비목표
      description: 이번 이슈에서 같이 하지 않을 변경을 적어주세요. 구현 단계가 「이번 PR에서 하지 말아야 할 확장」으로 소비한다.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 검증 방법
      description: 변경이 동작함을 어떻게 확인할지 적어주세요 (실행할 명령, 관측할 CI job 등).
    validations:
      required: true

  - type: textarea
    id: technical-notes
    attributes:
      label: 기술 노트
      description: "구현 시 참고할 제약 조건, 관련 모듈, 설계 문서 링크 등. 에픽 하위 이슈면 00-issue-management.md §3.4가 정한 대로 `- 선행: #번호`를 여기에 적는다. (선택)"

  - type: textarea
    id: done-criteria
    attributes:
      label: 완료 조건
      value: |
        - [ ] 변경 적용
        - [ ] 검증 방법 실행 및 결과 첨부
        - [ ] 기존 테스트 전체 통과
        - [ ] 관련 문서 갱신 (해당 시)
    validations:
      required: true
