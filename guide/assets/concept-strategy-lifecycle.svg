<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 200" role="img" aria-label="전략의 일생: 작성에서 운영까지">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7b8794"/>
    </marker>
    <marker id="arrfb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9aa5b1"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif;}
    .box{fill:#eef2f6;stroke:#c4ccd4;stroke-width:1.5;}
    .gate{fill:#fdf1d6;stroke:#dca63a;stroke-width:1.6;}
    .t{font-size:14px;fill:#1f2933;font-weight:600;}
    .sub{font-size:11px;fill:#7b8794;}
    .leg{font-size:12px;fill:#52606d;}
    .fbt{font-size:12px;fill:#9aa5b1;}
    .flow{stroke:#7b8794;stroke-width:1.8;fill:none;}
    .fb{stroke:#9aa5b1;stroke-width:1.4;stroke-dasharray:5 4;fill:none;}
  </style>
  <rect width="1130" height="200" fill="#ffffff"/>

  <!-- legend -->
  <rect x="20" y="20" width="14" height="14" rx="3" class="gate"/>
  <text x="42" y="32" class="leg">색칠된 단계 = 게이트(관문): 검증 · 백테스트 · 승인</text>

  <!-- nodes -->
  <g>
    <rect x="20"  y="56" width="150" height="64" rx="9" class="box"/>
    <text x="95"  y="84"  text-anchor="middle" class="t">전략 작성</text>
    <text x="95"  y="104" text-anchor="middle" class="sub">AI 에이전트</text>

    <rect x="208" y="56" width="150" height="64" rx="9" class="gate"/>
    <text x="283" y="84"  text-anchor="middle" class="t">① 정적 검증</text>
    <text x="283" y="104" text-anchor="middle" class="sub">strategy validate</text>

    <rect x="396" y="56" width="150" height="64" rx="9" class="gate"/>
    <text x="471" y="84"  text-anchor="middle" class="t">② 백테스트</text>
    <text x="471" y="104" text-anchor="middle" class="sub">backtest run</text>

    <rect x="584" y="56" width="150" height="64" rx="9" class="gate"/>
    <text x="659" y="84"  text-anchor="middle" class="t">③ 사용자 승인</text>
    <text x="659" y="104" text-anchor="middle" class="sub">approval</text>

    <rect x="772" y="56" width="150" height="64" rx="9" class="box"/>
    <text x="847" y="84"  text-anchor="middle" class="t">봇 생성·시작</text>
    <text x="847" y="104" text-anchor="middle" class="sub">bot create / start</text>

    <rect x="960" y="56" width="150" height="64" rx="9" class="box"/>
    <text x="1035" y="84"  text-anchor="middle" class="t">운영 · 모니터링</text>
    <text x="1035" y="104" text-anchor="middle" class="sub">trade · report</text>
  </g>

  <!-- flow arrows -->
  <path class="flow" marker-end="url(#arr)" d="M170,88 L206,88"/>
  <path class="flow" marker-end="url(#arr)" d="M358,88 L394,88"/>
  <path class="flow" marker-end="url(#arr)" d="M546,88 L582,88"/>
  <path class="flow" marker-end="url(#arr)" d="M734,88 L770,88"/>
  <path class="flow" marker-end="url(#arr)" d="M922,88 L958,88"/>

  <!-- feedback loop -->
  <path class="fb" marker-end="url(#arrfb)" d="M1035,120 C1035,182 95,182 95,122"/>
  <text x="565" y="176" text-anchor="middle" class="fbt">피드백 · 개선</text>
</svg>
