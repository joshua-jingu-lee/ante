minimum_pre_commit_version: "3.2.0"
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # 유지관리자 우회: SKIP=no-commit-to-branch git commit …
      - id: no-commit-to-branch
        name: "main 직접 커밋 차단 — 작업 브랜치에서 커밋하라"
        entry: bash -c 'test "$(git symbolic-ref -q HEAD)" != "refs/heads/main"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: check-comments
        name: "src/ante 주석·독스트링 이력 기준선 검사"
        entry: python scripts/check_comments.py
        language: system
        pass_filenames: false
        files: ^(src/ante/.*\.py|scripts/check_comments\.py|scripts/comment_baseline\.json)$
