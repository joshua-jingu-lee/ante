  # `open_cli_db` async-context wrap 으로 동치 변환이 불가능하다 (signal.py:35-38
  # 주석 invariant).
  - path: src/ante/cli/commands/signal.py
    line: 48
    reason: "signal connect — long_running stream channel (external process lifecycle)"

