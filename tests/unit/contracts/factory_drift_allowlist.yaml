  # `backtest history` 는 `offline` 이며 #1974 에서 `open_cli_db` (read_only)
  # 로 마이그레이션되어 직접 Database 생성 callsite 가 사라졌다 — 엔트리 제거.
  - path: src/ante/cli/commands/backtest.py
