  #
  # #1843 sub-PR 6: rule/strategy sub-class 5건 제거 — class-level ``.code``
  # 부여 + EXCEPTION_TO_SPEC 등록 완료. ``RuleError`` / ``StrategyError``
  # base 는 사용 사례 없음으로 baseline 보존 (#1842 ``AccountError`` 동형).
