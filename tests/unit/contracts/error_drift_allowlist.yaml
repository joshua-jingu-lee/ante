# Error taxonomy drift allowlist (#1841)
#
# 본 파일은 fmt.error code 누락 callsite (Family A) 와 ErrorSpec 등록되지
# 않은 domain exception class (Family B) 의 baseline 을 구조화 보관한다.
# 신규/수정 drift 는 enforcement test (`test_error_drift.py`) 가 차단하며,
# 본 파일에 entry 가 등록된 callsite/class 만 baseline 으로 면제된다.
#
# 3 section:
#
#   intended_no_code
#     code 인자를 영구적으로 갖지 않는 의도된 callsite.
#     예: click usage exit 처럼 envelope 변환 책임이 다른 layer 에 있음.
#
#   known_drift_fmt_error_no_code
#     baseline 시점에 code 가 부여되지 않은 fmt.error callsite.
#     #1843 이 단계적으로 제거한다.
#
#   pending_migration
#     baseline 시점에 class-level code 도 없고 EXCEPTION_TO_SPEC 등록도
#     안 된 *Error class. #1842/#1843 이 단계적으로 등록한다.
#
# Anchor 정책 (#1841 plan):
#   - fmt entry: (path, line, snippet_sha1) 3중 anchor.
#       snippet_sha1 = SHA-1(snippet)[:12]. snippet 가 바뀌면 anchor 갱신
#       필요. line 만 재사용되는 false negative 차단.
#   - exception entry: (module, class_anchor) 2중 anchor.
#       module = dotted module path (예: ante.account.errors).
#       class_anchor = class 이름.

# bot.py 924/960/994 (구 931/967/1001 → 구 882/918/952) 와 config.py 212/215
# (구 214/217 → 구 176/179) 의 ``ipc_send`` ClickException text-mode 분기는
# ``text = f"{code}: {message}"`` prefix 패턴이 의도된 영구 UX 계약이다. 회귀
# lock ``test_bot_start_error_text_mode_carries_code_prefix`` 와
# ``test_config_set_server_error`` 의 ``"STATIC_CONFIG" in result.output`` 가
# text 모드에서 ``code: message`` prefix 톤을 명시 요구하므로 단순
# ``fmt.error(message, code=code)`` 정렬이 UX 회귀가 된다. 따라서
# ``known_drift`` deferred 가 아닌 ``intended_no_code`` 영구 면제로 분류한다
# (#1870 옵션 3). #1941 commands 주석 정리로 line 번호가 7줄 위로 이동.
intended_no_code:
  - path: src/ante/cli/commands/bot.py
    line: 924
    snippet_sha1: "3dc4008c3fb0"
    reason: "text-mode {code}: {message} prefix UX lock — intended permanent (resolves #1870)"
  - path: src/ante/cli/commands/bot.py
    line: 960
    snippet_sha1: "3dc4008c3fb0"
    reason: "text-mode {code}: {message} prefix UX lock — intended permanent (resolves #1870)"
  - path: src/ante/cli/commands/bot.py
    line: 994
    snippet_sha1: "3dc4008c3fb0"
    reason: "text-mode {code}: {message} prefix UX lock — intended permanent (resolves #1870)"
  - path: src/ante/cli/commands/config.py
    line: 212
    snippet_sha1: "3dc4008c3fb0"
    reason: "text-mode {code}: {message} prefix UX lock — intended permanent (resolves #1870)"
  - path: src/ante/cli/commands/config.py
    line: 215
    snippet_sha1: "1b05e8ebf6bd"
    reason: "text-mode {code}: {message} prefix UX lock — intended permanent (resolves #1870)"

known_drift_fmt_error_no_code:
  # #1842: account.py line 762/804 entries 제거 — emit_cli_error 정렬 완료
  # (CLI direct path 가 IPC envelope 와 동일 public code surface).
  #
  # #1843 sub-PR 3: bot.py line 384/499 entries 제거 — line 384 ("봇을 찾을
  # 수 없습니다" sentinel) 는 ``code="BOT_NOT_FOUND"`` 명시 부여로 정렬,
  # line 499 (non-table-missing OperationalError fallback) 는 emit_cli_error
  # 로 ``EXECUTION_ERROR`` (registry miss fallback) surface 로 정렬.
  #
  # #1870 옵션 3: bot.py 931/967/1001 + config.py 214/217 entries 를
  # ``intended_no_code`` 로 영구 이동 — text-mode ``{code}: {message}``
  # prefix UX lock 은 의도된 계약이며 deferred 가 아니다.
  #
  # #1843 sub-PR 5: broker.py line 211/266/318 entries 제거 — emit_cli_error
  # 정렬 완료 (broker typed exception 5 sub-class 가 ``BROKER_*`` 안정 코드를
  # registry MRO lookup 으로 surface, 미분류 fault 는 ``EXECUTION_ERROR``
  # fallback).
  #
  # #1843 sub-PR 6: strategy.py 149/173/258 + update.py 135/196/256 entries
  # 제거 — strategy.py 149 는 ``code="STRATEGY_VALIDATION_ERROR"`` 명시
  # 부여 (ValidationResult 객체이므로 typed exception 경로 아님), 173/258
  # 은 ``emit_cli_error(fmt, e)`` 정렬 (StrategyLoadError/StrategyError
  # MRO lookup 으로 typed 코드 surface). update.py 135/196 은
  # ``code="UPDATE_CHECK_FAILED"`` 명시 부여, 256 은
  # ``code="UPDATE_INSTALL_FAILED"`` 명시 부여 (typed exception 없는
  # bool 반환 함수의 실패 surface).
  #
  # #1843 sub-PR 1: member.py entries 15건 제거 — emit_cli_error 정렬 완료
  # (CLI direct path 가 IPC envelope 와 동일 public code surface).
  # _MASTER_REQUIRED_MESSAGE override 보존하는 typed except 는 code 인자
  # 명시 (``code="PERMISSION_DENIED"``) 로 정렬했다.
  #
  # 본 section 은 현재 비어 있다 — #1870 이 마지막 5건 (bot.py 931/967/1001
  # + config.py 214/217) 을 ``intended_no_code`` 로 영구 이동하면서 baseline
  # 잔여분이 모두 해소되었다. 향후 신규 deferred drift 가 등장하면 본 section
  # 에 재등록한다.

