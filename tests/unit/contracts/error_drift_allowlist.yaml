# Error taxonomy drift allowlist (#1841)
#
# 본 파일은 ErrorSpec 등록되지 않은 domain exception class (Family B) 의
# baseline 을 구조화 보관한다. 신규/수정 drift 는 enforcement test
# (`test_error_drift.py`) 가 차단하며, 본 파일에 entry 가 등록된 class 만
# baseline 으로 면제된다. code 없는 ``fmt.error`` (옛 Family A) 는 진입점
# 래칫 ``cli_error_calls`` 가 막는다(#2738).
#
#   pending_migration
#     baseline 시점에 class-level code 도 없고 EXCEPTION_TO_SPEC 등록도
#     안 된 *Error class. #1842/#1843 이 단계적으로 등록한다.
#     등록하지 않는 class(인스턴스가 ``code`` 를 갖는 ``IPCRemoteError``)도 여기 둔다.
#
# Anchor 정책 (#1841 plan):
#   - exception entry: (module, class_anchor) 2중 anchor.
#       module = dotted module path (예: ante.account.errors).
#       class_anchor = class 이름.

pending_migration:
  # #2738 ⑧-2: IPCRemoteError 는 서버가 낸 코드를 인스턴스 ``code`` 로 갖는다.
  # 고정 코드로 등록하지 않는다(클래스 속성 ``code`` 없음).
  - module: ante.contracts.ipc_client_errors
    class_anchor: IPCRemoteError
    reason: "server code per instance (#2738); not registered by design"
  - module: ante.core.account_id
    class_anchor: AccountError
    reason: "baseline (#1841); register in #1842/#1843"
  - module: ante.approval.errors
    class_anchor: ApprovalError
    reason: "baseline (#1841); register in #1842/#1843"
  # #1843 sub-PR 2: ApprovalValidationError 제거 — class-level
  # ``code="APPROVAL_VALIDATION_ERROR"`` 부여 + EXCEPTION_TO_SPEC 등록 완료.
  # ApprovalStatusConflictError 는 이미 class-level ``.code`` (#1813 Group Q)
  # 를 보유해 본 allowlist 에 등록되어 있지 않았다 — 본 PR 의 registry 등록
  # 만으로 helper 가 typed code 를 resolve 한다.
  - module: ante.backtest.exceptions
    class_anchor: BacktestConfigError
    reason: "baseline (#1841); register in #1842/#1843"
  - module: ante.backtest.exceptions
    class_anchor: BacktestDataError
    reason: "baseline (#1841); register in #1842/#1843"
  - module: ante.backtest.exceptions
    class_anchor: BacktestError
    reason: "baseline (#1841); register in #1842/#1843"
  - module: ante.bot.exceptions
    class_anchor: BotError
    reason: "baseline (#1841); register in #1842/#1843"
  # #1843 sub-PR 5: broker 5 sub-class (APIError/AuthenticationError/
  # CircuitOpenError/OrderNotFoundError/RateLimitError) + registry
  # InvalidBrokerTypeError 제거 — class-level ``.code`` 부여 +
  # EXCEPTION_TO_SPEC 등록 완료. ``BrokerError`` base 는 사용 사례가
  # 없어 baseline 보존 (#1842 ``AccountError`` 동형).
  - module: ante.broker.exceptions
    class_anchor: BrokerError
    reason: "base — no callsite; pending_migration baseline (#1842 AccountError 동형)"
  - module: ante.config.exceptions
    class_anchor: ConfigError
    reason: "base — no callsite; pending_migration baseline (#1842 AccountError 동형)"
  # #2095: store 내부 손상-파티션 예외. read(strict=True) 경로에서만 raise되며
  # data_provider.load()가 즉시 BacktestDataError(이미 pending_migration 등록)로
  # wrap·re-raise하므로 CLI/IPC 표면에 직접 노출되지 않는다. backtest sibling
  # 예외(BacktestDataError 등)와 동형으로 baseline 보존.
  - module: ante.data.store
    class_anchor: ParquetReadError
    reason: "internal store fault wrapped into BacktestDataError (#2095); baseline (#1842 동형)"
  - module: ante.feed.sources.dart
