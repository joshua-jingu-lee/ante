[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ante"
version = "0.10.1"
description = "AI-Native Trading Engine"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "polars>=1.0",
    "pydantic>=2.0",
    "pandas-ta>=0.4.71b0",
    # Pin click to 8.1.x; Click 8.2 deprecates Context.protected_args and changes
    # ``Group.no_args_is_help`` exit-code semantics that LeafAwareGroup/
    # authenticated_group rely on (#1404). Migration is tracked as a follow-up.
    "click>=8.1,<8.2",
    "websockets>=13.0",
    # cryptography 47/48 arm64 wheels SIGILL on Docker/Apple Silicon (#1293)
    "cryptography>=44.0,<47",
]

[project.scripts]
ante = "ante.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ante"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
# pandas-ta 0.4.71b0 import 시점의 mode.copy_on_write deprecation
# (pandas 3.0+에서 항상 enabled, pandas 4.0에서 제거 예정).
# 메시지 정규식 + DeprecationWarning 결합으로 pandas 2.x 환경에서도
# 클래스 lookup 실패 없이 동작한다 (pandas 3.x의 해당 경고는 DeprecationWarning 자손).
# default 정책으로 출력은 유지하면서 회귀 가시성을 보전한다 (#1191).
filterwarnings = [
    "default:.*mode\\.copy_on_write.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true
# CI 단계적 강화: 현재는 위험 오류(attr-defined, operator, call-arg 등)만 차단
# 향후 아래 옵션을 활성화하여 strict로 전환
# disallow_untyped_defs = true
# warn_return_any = true

[tool.coverage.run]
source = ["src/ante"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): v{version}"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "build", "chore", "ci", "docs", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
