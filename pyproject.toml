[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ante"
version = "0.12.0"
description = "AI-Native Trading Engine"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "polars>=1.0",
    "pydantic>=2.8.1",
    "pandas-ta>=0.4.71b0",
    # Pin click to 8.1.x; Click 8.2 deprecates Context.protected_args and changes
    # ``Group.no_args_is_help`` exit-code semantics that LeafAwareGroup/
    # authenticated_group rely on (#1404). Migration is tracked as a follow-up.
    "click>=8.1,<8.2",
    "websockets>=13.0",
    # cryptography 47/48 arm64 wheels SIGILL on Docker/Apple Silicon (#1293)
    "cryptography>=44.0,<47",
]

[project.scripts]
ante = "ante.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5",
    "pyyaml>=6.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ante"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
# pandas-ta 0.4.71b0 import 시점의 mode.copy_on_write deprecation
# (pandas 3.0+에서 항상 enabled, pandas 4.0에서 제거 예정).
# 메시지 정규식 + DeprecationWarning 결합으로 pandas 2.x 환경에서도
# 클래스 lookup 실패 없이 동작한다 (pandas 3.x의 해당 경고는 DeprecationWarning 자손).
# default 정책으로 출력은 유지하면서 회귀 가시성을 보전한다 (#1191).
filterwarnings = [
    "default:.*mode\\.copy_on_write.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "PGH003", "PGH004", "RUF100", "RUF102"]

[tool.ruff.lint.per-file-ignores]
"!src/**" = ["RUF100"]
"src/ante/core/clock.py" = ["TID251"]

# 시각 판독은 ante.core.clock만 한다 (#2768). TID251은 아직 기본 select에 없고
# scripts/check_lint_ratchet.py가 src/의 위반 수를 래칫으로 잰다.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now" = { msg = "ante.core.clock.now(tz)를 쓴다." }
"datetime.datetime.utcnow" = { msg = "ante.core.clock.now(UTC)를 쓴다." }
"datetime.datetime.today" = { msg = "ante.core.clock.now(tz)를 쓴다." }
"datetime.date.today" = { msg = "ante.core.clock.now(tz).date()를 쓴다." }
"time.time" = { msg = "ante.core.clock.now(UTC).timestamp()를 쓴다." }
"time.time_ns" = { msg = "ante.core.clock.now(UTC).timestamp()를 쓴다." }
"time.monotonic" = { msg = "ante.core.clock.monotonic()을 쓴다." }
"time.monotonic_ns" = { msg = "ante.core.clock.monotonic()을 쓴다." }
"time.perf_counter" = { msg = "ante.core.clock.monotonic()을 쓴다." }
"time.perf_counter_ns" = { msg = "ante.core.clock.monotonic()을 쓴다." }
"time.localtime" = { msg = "ante.core.clock.now(tz)를 쓴다." }
"time.gmtime" = { msg = "ante.core.clock.now(UTC)를 쓴다." }
"time.ctime" = { msg = "ante.core.clock.now(tz)를 쓴다." }
"time.strftime" = { msg = "ante.core.clock.now(tz).strftime()을 쓴다." }
"ante.core.clock.set_clock" = { msg = "운영 코드는 시계를 바꾸지 않는다." }
"ante.core.clock.use_clock" = { msg = "운영 코드는 시계를 바꾸지 않는다." }

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true
strict = true

[tool.coverage.run]
source = ["src/ante"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): v{version}"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "build", "chore", "ci", "docs", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
